<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

  <!-- Latin primary -->
  <match target="pattern"><test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Sans Pro</string></edit></match>
  <match target="pattern"><test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Serif Pro</string></edit></match>
  <match target="pattern"><test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>FantasqueSansM Nerd Font Mono</string></edit></match>

  <!-- Per-language CJK -->
  <match target="pattern"><test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Han Sans</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Han Serif</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Han Sans K</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Han Serif K</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Han Sans TC</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Han Serif TC</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Han Sans HC</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Source Han Serif TC</string></edit></match>

  <!-- Default CJK: LXGW WenKai GB Screen, Source Han SC as coverage -->
  <match target="pattern"><test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>LXGW WenKai GB Screen</string><string>Source Han Sans SC</string></edit></match>
  <match target="pattern"><test name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>LXGW WenKai GB Screen</string><string>Source Han Serif SC</string></edit></match>
  <match target="pattern"><test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="strong"><string>LXGW WenKai GB Screen</string><string>Source Han Sans SC</string></edit></match>

  <!-- App-name aliases -->
  <alias><family>Arial</family><prefer><family>sans-serif</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>sans-serif</family></prefer></alias>
  <alias><family>Liberation Sans</family><prefer><family>sans-serif</family></prefer></alias>
  <alias><family>Liberation Mono</family><prefer><family>monospace</family></prefer></alias>
  <alias><family>Courier</family><prefer><family>monospace</family></prefer></alias>

  <!-- Rendering -->
  <match target="font"><edit name="hinting" mode="assign"><bool>false</bool></edit></match>
  <match target="font"><edit name="hintstyle" mode="assign"><const>hintnone</const></edit></match>

  <dir>~/.fonts</dir>
  <config><rescan><int>300</int></rescan></config>
</fontconfig>
